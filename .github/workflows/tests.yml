name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node audit/engine-tests.js && node audit/stress-tests.js
